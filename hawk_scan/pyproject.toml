[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk-scan"
version = "0.1.0"
description = "Remote endpoint PII and secrets scanner for Windows domain environments"
requires-python = ">=3.11"
dependencies = [
    "pypsrp>=0.9.0",
    "smbprotocol>=1.13.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
hawk_scan = "hawk_scan.cli:main"

[tool.setuptools.packages.find]
include = ["hawk_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
