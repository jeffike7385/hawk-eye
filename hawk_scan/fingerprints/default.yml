# Hawk Scan Default Fingerprints — PII & Document Classification
#
# min_matches: only flag if this many matches found in a single file
# require_all: compound rule — all sub-patterns must match in the same file
# context_keywords: boosts confidence when these words appear near matches

# === Social Security Numbers ===
# Only flag files with 3+ SSNs (bulk exposure, not a stray number)

SSN:
  pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
  severity: high
  category: pii
  min_matches: 3
  context_keywords: ["ssn", "social security", "tax id", "taxpayer"]

SSN No Dashes:
  pattern: "\\b(?!000|666|9\\d{2})\\d{3}(?!00)\\d{2}(?!0000)\\d{4}\\b"
  severity: high
  category: pii
  min_matches: 3
  context_keywords: ["ssn", "social security", "tax id", "taxpayer"]

# === Credit Card Numbers ===
# Only flag files with 10+ (a list/database extract, not a stray number)

Credit Card Number:
  pattern: "\\b(?:4\\d{3}|5[1-5]\\d{2}|3[47]\\d{2}|6(?:011|5\\d{2}))[-\\s]?\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}\\b"
  severity: high
  category: pii
  min_matches: 10

# === Driver License Numbers ===
# Only flag files with 10+ (a list, not isolated)

Driver License:
  pattern: "\\b[A-Z]\\d{6,8}\\b"
  severity: medium
  category: pii
  min_matches: 10
  context_keywords: ["driver", "license", "licence", "DL", "CDL"]

# === Bank Account + Routing Number (co-occurrence) ===
# Only flags when BOTH appear in the same file

Bank Account with Routing Number:
  severity: high
  category: pii
  require_all:
    routing_number: "\\b(?:0[1-9]|[1-2]\\d|3[0-2])\\d{7}\\b"
    account_number: "\\b\\d{8,17}\\b"

# === US Passport ===

US Passport Number:
  pattern: "\\b[A-Z]\\d{8}\\b"
  severity: high
  category: pii
  min_matches: 2
  context_keywords: ["passport", "travel document"]

# === Tax IDs ===

ITIN:
  pattern: "\\b9\\d{2}-[7-9]\\d-\\d{4}\\b"
  severity: high
  category: pii
  min_matches: 2
  context_keywords: ["itin", "taxpayer", "tax"]

EIN:
  pattern: "\\b\\d{2}-\\d{7}\\b"
  severity: medium
  category: pii
  min_matches: 3
  context_keywords: ["ein", "employer", "federal tax", "fein"]

# === Bulk Email Exposure ===
# Only flag files with 10+ emails (a contact list, not signatures)

Email:
  pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
  severity: low
  category: pii
  min_matches: 10

# === Document Classification Markings ===

Classification - Confidential:
  pattern: "(?i)\\b(CONFIDENTIAL|STRICTLY CONFIDENTIAL)\\b"
  severity: high
  category: classification

Classification - Secret:
  pattern: "(?i)\\bSECRET\\b"
  severity: high
  category: classification
  context_keywords: ["classified", "classification", "handling", "distribution"]

Classification - Restricted:
  pattern: "(?i)\\bRESTRICTED\\b"
  severity: medium
  category: classification
  context_keywords: ["classified", "classification", "handling", "distribution"]

Classification - Internal Use Only:
  pattern: "(?i)\\bINTERNAL USE(\\s+ONLY)?\\b"
  severity: medium
  category: classification
