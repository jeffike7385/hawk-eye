# === US PII Patterns ===

SSN:
  pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
  severity: high
  category: pii
  context_keywords: ["ssn", "social security", "tax id", "taxpayer"]

US Passport Number:
  pattern: "\\b[A-Z]\\d{8}\\b"
  severity: high
  category: pii
  context_keywords: ["passport", "travel document"]

ITIN:
  pattern: "\\b9\\d{2}-[7-9]\\d-\\d{4}\\b"
  severity: high
  category: pii
  context_keywords: ["itin", "taxpayer", "tax"]

EIN:
  pattern: "\\b\\d{2}-\\d{7}\\b"
  severity: medium
  category: pii
  context_keywords: ["ein", "employer", "federal tax"]

US Phone Number:
  pattern: "\\b(?:\\+?1[-. ]?)?\\(?\\d{3}\\)?[-. ]?\\d{3}[-. ]?\\d{4}\\b"
  severity: low
  category: pii

Email:
  pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
  severity: low
  category: pii

Credit Card Number:
  pattern: "\\b(?:4\\d{3}|5[1-5]\\d{2}|3[47]\\d{2}|6(?:011|5\\d{2}))[-\\s]?\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}\\b"
  severity: high
  category: pii

US Bank Routing Number:
  pattern: "\\b(?:0[1-9]|[1-2]\\d|3[0-2])\\d{7}\\b"
  severity: medium
  category: pii
  context_keywords: ["routing", "aba", "bank", "transit"]

Driver License:
  pattern: "\\b[A-Z]\\d{3,8}\\b"
  severity: medium
  category: pii
  context_keywords: ["driver", "license", "licence", "DL", "CDL"]

# === Azure / M365 / Microsoft Secrets ===

Azure AD Client Secret:
  pattern: "(?i)(?:client.?secret|app.?secret)[\\s:=]+['\"]?([A-Za-z0-9~._-]{34,})['\"]?"
  severity: high
  category: secret

Azure Storage Account Key:
  pattern: "[A-Za-z0-9+/]{86}=="
  severity: high
  category: secret
  context_keywords: ["AccountKey", "storage", "DefaultEndpointsProtocol"]

Azure SAS Token:
  pattern: "[?&]s(?:ig|v|e|sp|srt|ss|se|st|spr)=[A-Za-z0-9%+/=&]+"
  severity: high
  category: secret
  context_keywords: ["blob.core.windows.net", "queue.core.windows.net", "table.core.windows.net", "file.core.windows.net"]

Azure SQL Connection String:
  pattern: "(?i)Server=tcp:[^;]+;.*(?:Password|Pwd)=[^;]+"
  severity: high
  category: secret

Azure Service Bus Connection String:
  pattern: "(?i)Endpoint=sb://[^;]+;SharedAccessKey(?:Name)?=[^;]+"
  severity: high
  category: secret

Microsoft Graph Token:
  pattern: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
  severity: high
  category: secret
  context_keywords: ["graph.microsoft.com", "Bearer", "access_token"]

Azure DevOps PAT:
  pattern: "(?i)(?:pat|token)[\\s:=]+['\"]?[a-z2-7]{52}['\"]?"
  severity: high
  category: secret
  context_keywords: ["dev.azure.com", "visualstudio.com", "devops"]

# === Power Platform / Dynamics ===

Dataverse Connection String:
  pattern: "(?i)AuthType=\\w+;.*Url=https://[^;]+\\.dynamics\\.com"
  severity: high
  category: secret

Dynamics 365 Connection String:
  pattern: "(?i)(?:ServiceUri|Url)\\s*=\\s*https://[^;]+\\.crm\\d*\\.dynamics\\.com[^;]*;.*(?:Password|ClientSecret)=[^;]+"
  severity: high
  category: secret

Power Automate Connection:
  pattern: "(?i)(?:shared_[a-z]+|connectionId)[\\s:=]+['\"]?[a-f0-9-]{36}['\"]?"
  severity: medium
  category: secret
  context_keywords: ["flow", "power automate", "logic app"]

# === Generic Secrets ===

Private Key File:
  pattern: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
  severity: high
  category: secret

PFX Certificate Reference:
  pattern: "(?i)(?:pfx|p12|certificate)[\\s:=]+['\"]?[^'\"\\s]+\\.(?:pfx|p12)['\"]?"
  severity: medium
  category: secret

Generic Password in Config:
  pattern: "(?i)(?:password|passwd|pwd|secret|token)[\\s]*[=:][\\s]*['\"]?[^\\s'\"]{8,}['\"]?"
  severity: medium
  category: secret

Basic Auth in URL:
  pattern: "[a-zA-Z]{3,10}://[^/\\s:@]{3,20}:[^/\\s:@]{3,20}@.{1,100}"
  severity: high
  category: secret

Slack Token:
  pattern: "xox[bpors]-[0-9A-Za-z\\-]{10,}"
  severity: high
  category: secret

Slack Webhook:
  pattern: "https://hooks\\.slack\\.com/services/T[0-9A-Za-z_-]{10}/B[0-9A-Za-z_-]{10}/[0-9A-Za-z_-]{23}"
  severity: high
  category: secret
